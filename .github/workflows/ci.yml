name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository contract
        run: python -m unittest backend.tests.test_repository_foundation
      - name: Validate Docker Compose
        run: docker compose --env-file .env.example config --quiet

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          python-version: "3.12"
      - name: Install backend tooling
        run: python -m pip install --upgrade pip && python -m pip install -e "backend[dev]"
      - name: Check formatting
        run: ruff format --check backend
      - name: Lint
        run: ruff check backend
      - name: Type check
        run: mypy --config-file backend/pyproject.toml backend/src backend/tests
      - name: Test
        run: pytest -c backend/pyproject.toml backend/tests
      - name: Build package
        run: python -m build backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: "22"
      - name: Install frontend tooling
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test --workspace frontend
      - name: Test desktop shell
        run: npm run test --workspace desktop
      - name: Build
        run: npm run build
